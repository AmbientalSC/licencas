<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.firebaseio.com https://firebasestorage.googleapis.com https://*.firebasestorage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://us-central1-licencas-a47f9.cloudfunctions.net; img-src 'self' data: blob:; frame-src 'self' https://*.firebaseapp.com; form-action 'self'; base-uri 'self';" />
    <title>Gestao de Licencas Ambientais</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var savedPreference = localStorage.getItem('themePreference');
          var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
          var initialTheme = savedPreference === 'light' || savedPreference === 'dark'
            ? savedPreference
            : systemTheme;
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(initialTheme);
          root.style.colorScheme = initialTheme;
        } catch (e) {
          // Ignore bootstrap theme errors.
        }
      })();
    </script>
  </head>
  <body class="bg-gray-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
